[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibd-microbiome-framework"
version = "0.1.0"
description = "Confound-aware and portability-aware IBD multi-omics analysis"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
model = ["xgboost>=2.0", "torch>=2.2", "torch-geometric>=2.5"]
third-cohort = ["rdata>=1.0", "xarray>=2024.1"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
